metadata_id = "connection_suite.home.window"
kind = "window"
schema_version = "1"
title = "Connection Suite"
label = "Connection Suite"

[metadata]
contract_id = "connection_suite.home.window"
logical_kind = "connection_suite_shell"
owner_area = "gui"
target_area_id = "connection"
target_suite_id = "connection_suite"
target_module_id = "connection.gui_home"
window_id = "connection_suite.home.window"
object_name = "connection_suite_window"
test_id = "connection_suite_window"
instance_policy = "standalone"
status = "shell_only"
ownership_scope = "presentation_shell_only"
dummy_data_status = "local_in_memory_gui_dummy_only"
description = "GUI presentation shell for Connection Suite provider, account, API, websocket, and historical download overview placeholders."
object_family = "window"
object_kind = "connection_suite_shell"

[metadata.traceability]
object_id_policy = "stable_readable_deterministic_ids"
qt_object_name_policy = "objectName equals object_id for constructed controls; top-level window objectName maps through metadata.object_name."
parent_child_policy = "Parent IDs are exposed through metadata and Qt dynamic property parent_object_id."
no_anonymous_widgets = true

[metadata.boundary_guarantees]
gui_presentation_only = true
domain_workflow_not_owned_by_gui = true
no_backend_execution = true
no_provider_api_call = true
no_websocket_behavior = true
no_account_sync = true
no_credential_load = true
no_download_execution = true
no_storage_write = true
no_runtime_manager_control = true
no_object_map_mutation = true

[metadata.dummy_data]
source_module = "leonardo.gui.dummy_data"
deterministic = true
local_in_memory = true
network_calls = false
storage_writes = false

[geometry]
width = 1280
height = 820

[display]
visible = true
enabled = true
theme = "system"

[style]
font_size = 14
density = "comfortable"

