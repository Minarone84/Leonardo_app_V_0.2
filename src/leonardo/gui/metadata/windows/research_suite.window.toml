metadata_id = "research_suite.window"
kind = "window"
schema_version = "1"
title = "Research Suite"
label = "Research Suite"

[metadata]
contract_id = "research_suite.window"
logical_kind = "research_suite_shell"
owner_area = "gui"
target_area_id = "research"
target_suite_id = "research_suite"
target_module_id = "research.gui_shell"
window_id = "research_suite.window"
object_name = "research_suite_window"
test_id = "research_suite_window"
instance_policy = "standalone"
status = "shell_only"
ownership_scope = "presentation_shell_only"
dummy_data_status = "local_in_memory_gui_dummy_only"
object_family = "window"
object_kind = "research_suite_shell"

[metadata.traceability]
object_id_policy = "stable_readable_deterministic_ids"
qt_object_name_policy = "objectName equals object_id for constructed controls; top-level window objectName maps through metadata.object_name."
parent_child_policy = "Parent IDs are exposed through metadata and Qt dynamic property parent_object_id."
no_anonymous_widgets = true

[metadata.boundary_guarantees]
gui_presentation_only = true
no_provider_api_call = true
no_storage_write = true
no_runtime_manager_control = true
no_object_map_mutation = true
no_chart_calculation = true
no_chart_renderer = true

[metadata.dummy_data]
source_module = "leonardo.gui.dummy_data"
deterministic = true
local_in_memory = true
network_calls = false
storage_writes = false
