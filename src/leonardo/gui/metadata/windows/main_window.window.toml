metadata_id = "main_window.window"
kind = "window"
schema_version = "1"
title = "Leonardo"
label = "Leonardo"

[metadata]
contract_id = "main_window.window"
logical_kind = "main_application_shell"
owner_area = "gui"
window_id = "main_window.window"
object_name = "main_window"
test_id = "main_window"
instance_policy = "singleton"
status = "shell_only"
ownership_scope = "presentation_shell_only"
dummy_data_status = "local_in_memory_gui_dummy_only"

[metadata.menu_bar]
present = true
menus = ["File", "Connection", "Research Suite", "Data Manager", "Analysis Suite", "Trading Suite", "Runtime Manager", "Settings", "User"]
object_id = "main_window.menu_bar"

[metadata.traceability]
object_id_policy = "stable_readable_deterministic_ids"
qt_object_name_policy = "objectName equals object_id for actions, menus, launcher buttons, panels, and display widgets; top-level window objectName maps through metadata.object_name while metadata.window_id remains the window object_id."
parent_child_policy = "Parent IDs are exposed in widget/action metadata and as Qt dynamic property parent_object_id where widgets are constructed."
no_anonymous_widgets = true

