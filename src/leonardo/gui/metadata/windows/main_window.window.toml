purpose = "Launch surface for the Connection Suite Download Manager shell."
permission_ref = "download:view"
status = "shell_only"
implementation_status = "opens_historical_download_manager_shell"
area = "connection"
ownership_scope = "launch_surface_only"
execution_owner = "none_shell_only"
storage_owner = "none_shell_only"
