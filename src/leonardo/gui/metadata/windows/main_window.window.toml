metadata_id = "main_window.window"
kind = "window"
schema_version = "1"
title = "Leonardo"
label = "Leonardo"

[metadata]
contract_id = "main_window.window"
logical_kind = "main_application_shell"
owner_area = "shell"
window_id = "main_window.window"
object_name = "main_window"
test_id = "main_window"
instance_policy = "singleton"

[metadata.menu_bar]
present = true
menus = ["File", "Download Manager", "Connections", "User"]

[metadata.launch_surfaces.download_data]
action_id = "main_window.download_data"
label = "Download Data"
target_window_id = "download_request_builder.window"
target_workflow_id = "download_data"
boundary_id = "download_data_boundary"
purpose = "Open the Download Data selection and draft shell."
permission_ref = "download:view"
implementation_status = "opens_existing_builder_shell"
area = "download_manager"
ownership_scope = "launch_surface_only"
execution_owner = "composition_core_download_manager"
storage_owner = "download_data_sandbox_writer"
no_execution_ownership = true
no_storage_ownership = true

[metadata.launch_surfaces.ohlcv_maintenance]
action_id = "main_window.ohlcv_maintenance"
label = "OHLCV Maintenance"
target_window_id = "download_request_builder.window"
target_workflow_id = "ohlcv_maintenance"
related_boundary_id = "download_data_boundary"
purpose = "Open the retained builder shell in deferred OHLCV Maintenance mode."
permission_ref = "download:view"
implementation_status = "deferred_shell_entry"

[metadata.ai_inspection]
inspectable = true
allowed_path = "stable window and action identifiers through normal GUI action observation"
notes = [
    "Future AI helper work may inspect this metadata but must not bypass user policy, action observation, Core routing, runtime state, audit, provider, storage, or GUI ownership boundaries.",
]

[metadata.documentation]
docs_refs = [
    "docs/gui_docs/GUI_COMPOSITION.md",
    "docs/contracts_docs/DOWNLOAD_DATA_BOUNDARY.md",
    "docs/contracts_docs/DOWNLOAD_DATA_EXECUTION.md",
    "docs/core_docs/DOWNLOAD_DATA_OBJECT_MAP_PATTERN.md",
    "docs/core_docs/DOWNLOAD_DATA_RUNTIME_SUMMARY.md",
    "docs/core_docs/DOWNLOAD_DATA_USER_SMOKE_TEST.md",
]
test_refs = [
    "tests/gui_test/test_main_window_metadata.py",
    "tests/gui_test/test_main_window_shell.py",
    "tests/gui_test/test_gui_composition.py",
]

[metadata.geometry_policy]
start_mode = "maximized"
minimum_width = 1280
minimum_height = 800

[metadata.style_tokens]
theme_role = "application_shell"
background = "surface"
foreground = "text"

[geometry]
width = 1440
height = 900

[display]
visible = true
enabled = true
theme = "system"

[style]
font_size = 14
density = "comfortable"

[[regions]]
region_id = "menu_bar"
label = "Menu Bar"

[[regions]]
region_id = "central"
label = "Central Content"

[[regions]]
region_id = "status_bar"
label = "Status Bar"

[[regions]]
region_id = "user_display"
label = "User Display"

[[regions]]
region_id = "version_display"
label = "Version Display"

[[actions]]
action_id = "main_window.open_dummy_metadata_test"
label = "Open Dummy Metadata Test"

[[actions]]
action_id = "main_window.open_settings_inspector"
label = "Settings"

[[actions]]
action_id = "main_window.open_runtime_manager"
label = "Runtime Manager"

[[actions]]
action_id = "main_window.exit"
label = "Exit"

[[actions]]
action_id = "main_window.download_data"
label = "Download Data"

[[actions]]
action_id = "main_window.ohlcv_maintenance"
label = "OHLCV Maintenance"

[[actions]]
action_id = "main_window.open_trading_suite"
label = "Trading Suite"

[[actions]]
action_id = "main_window.open_research_suite"
label = "Research Suite"

[[actions]]
