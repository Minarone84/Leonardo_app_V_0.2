metadata_id = "download_request_builder.window"
kind = "window"
schema_version = "1"
title = "Download Request Builder"
label = "Download Request Builder"

[metadata]
contract_id = "download_request_builder.window"
logical_kind = "download_request_builder"
owner_area = "download_manager"
window_id = "download_request_builder.window"
object_name = "download_request_builder_window"
test_id = "download_request_builder_window"
instance_policy = "singleton"
description = "Existing builder for Download Data and OHLCV Maintenance drafts."
object_family = "window"
object_kind = "download_data_selection_shell"
boundary_id = "download_data_boundary"
workflow_id = "download_data"

[metadata.download_data_workflow]
boundary_id = "download_data_boundary"
workflow_id = "download_data"
current_shell_stage = "selection_draft"
current_contract_bridge = "DownloadRequestDraft -> DownloadRequest"
accepted_sequence = [
    "selection",
    "selection_recap",
    "preflight",
    "process_confirmation",
    "progress",
    "final_recap",
]
implemented_stage_notes = [
    "The current shell renders selection fields and a draft submit action.",
    "The current shell can format a preflight callback result when called through existing code, but no visible Preview button is exposed.",
]
not_implemented_stages = [
    "selection_recap",
    "visible_preflight",
    "process_confirmation",
    "progress",
    "final_recap",
]
future_contracts = [
    "DownloadDataSelectionDraft",
    "DownloadDataSelectionSummary",
    "DownloadDataPreflightSummary",
    "DownloadDataProgressSummary",
    "DownloadDataCompletionSummary",
]

[metadata.boundary_guarantees]
no_downloader_execution = true
no_provider_api_call = true
no_storage_write = true
no_cancellation_behavior = true
no_data_manager_integration = true
no_runtime_manager_control = true
no_object_map_service_mutation = true
no_ai_helper_implementation = true
forbidden_behavior = [
    "downloader_execution",
    "provider_api_call",
    "storage_write",
    "cancellation_behavior",
    "data_manager_integration",
    "runtime_manager_control",
    "object_map_service_mutation",
    "ai_helper_implementation",
]

[metadata.ai_inspection]
inspectable = true
allowed_path = "stable window and action identifiers through normal GUI action observation"
notes = [
    "Future AI helper work may inspect field and action metadata but must not mutate GUI state, Core internals, provider state, storage, Data Manager state, Runtime Manager state, or Object Map service state directly.",
]

[metadata.documentation]
docs_refs = [
    "docs/gui_readme.md",
    "docs/gui_docs/GUI_COMPOSITION.md",
    "docs/contracts_docs/DOWNLOAD_DATA_BOUNDARY.md",
    "docs/core_docs/DOWNLOAD_DATA_OBJECT_MAP_PATTERN.md",
    "docs/core_docs/DOWNLOAD_DATA_RUNTIME_SUMMARY.md",
]
test_refs = [
    "tests/gui_test/test_download_request_builder_window.py",
    "tests/gui_test/test_download_request_mapper.py",
    "tests/gui_test/test_gui_composition.py",
]

[[metadata.action_descriptors]]
action_id = "download_request_builder.draft_summary"
label = "Draft Summary"
purpose = "Existing internal action identifier for formatting the current draft summary."
workflow_stage = "selection_draft"
visibility = "internal_not_visible"
permission_ref = "download:view"

[[metadata.action_descriptors]]
action_id = "download_request_builder.preview_preflight"
label = "Preview Preflight"
purpose = "Existing internal action identifier for formatting an injected preflight preview result."
workflow_stage = "preflight_preview"
visibility = "internal_not_visible"
permission_ref = "download:preview"

[[metadata.action_descriptors]]
action_id = "download_request_builder.submit"
label = "Start"
purpose = "Submit the current Download Request Builder draft through the existing composition bridge."
workflow_stage = "selection_draft"
visibility = "visible_button"
permission_ref = "download:submit"

[[metadata.action_descriptors]]
action_id = "download_request_builder.close"
label = "Close"
purpose = "Close the Download Request Builder window."
workflow_stage = "window_lifecycle"
visibility = "visible_button"
permission_ref = "download:view"

